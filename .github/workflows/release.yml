name: build
on:
  push: { branches: [main], tags: ['v*'] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  inst: linux,   ext: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, inst: linux,   ext: "" }
          - { os: macos-15-intel,   target: x86_64-apple-darwin,       inst: macos,   ext: "" }
          - { os: macos-latest,     target: aarch64-apple-darwin,      inst: macos,   ext: "" }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    inst: windows, ext: ".exe", arch: x64 }
          - { os: windows-11-arm,   target: aarch64-pc-windows-msvc,   inst: windows, ext: ".exe", arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sibling open-cpu (bundled)
        shell: bash
        run: |
          [ -d "$GITHUB_WORKSPACE/../open-cpu" ] || git clone --depth 1 https://github.com/aon-co-jp/open-cpu.git "$GITHUB_WORKSPACE/../open-cpu"
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: test (differential vs CPython)
        shell: bash
        run: python3 tests/run.py target/${{ matrix.target }}/release/rmojo${{ matrix.ext }} || python tests/run.py target/${{ matrix.target }}/release/rmojo${{ matrix.ext }}
      - name: package (unix)
        if: matrix.inst != 'windows'
        shell: bash
        run: |
          d=rmojo-${{ matrix.target }}; mkdir $d
          cp target/${{ matrix.target }}/release/rmojo $d/; cp installers/${{ matrix.inst }}/*.sh $d/; cp -r examples README.md LICENSE $d/
          tar czf $d.tar.gz $d
      - name: installer (windows)
        if: matrix.inst == 'windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DArch=${{ matrix.arch }} /DBinDir=..\..\target\${{ matrix.target }}\release installers\windows\rmojo.iss
          Copy-Item installers\windows\Output\RMojo-Setup-${{ matrix.arch }}.exe RMojo-Setup-${{ matrix.arch }}.exe
      - uses: actions/upload-artifact@v4
        with: { name: "rmojo-${{ matrix.target }}", path: "rmojo-*.tar.gz\nRMojo-Setup-*.exe", if-no-files-found: ignore }
  android-ios-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sibling open-cpu (bundled)
        shell: bash
        run: |
          [ -d "$GITHUB_WORKSPACE/../open-cpu" ] || git clone --depth 1 https://github.com/aon-co-jp/open-cpu.git "$GITHUB_WORKSPACE/../open-cpu"
      - run: rustup target add aarch64-apple-ios aarch64-linux-android
      - run: cargo check --release --target aarch64-apple-ios
      - run: |
          cargo install cargo-ndk --locked
          rustup target add aarch64-linux-android
          cargo ndk -t arm64-v8a build --release
          mkdir rmojo-android-aarch64; cp target/aarch64-linux-android/release/rmojo installers/android/install.sh README.md rmojo-android-aarch64/
          tar czf rmojo-android-aarch64.tar.gz rmojo-android-aarch64
      - uses: actions/upload-artifact@v4
        with: { name: rmojo-android-aarch64, path: rmojo-android-aarch64.tar.gz }
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android-ios-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: sha256 for every asset (used by the startup self-update to verify downloads)
        run: cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done
      - uses: softprops/action-gh-release@v2
        with: { files: "dist/*" }
