name: build
on:
  push: { branches: [main], tags: ['v*'] }
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'   # 毎日: 最新の上流で再試験
permissions: { contents: write }
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  inst: linux,   ext: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, inst: linux,   ext: "" }
          - { os: macos-15-intel,   target: x86_64-apple-darwin,       inst: macos,   ext: "" }
          - { os: macos-latest,     target: aarch64-apple-darwin,      inst: macos,   ext: "" }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    inst: windows, ext: ".exe", arch: x64 }
          - { os: windows-11-arm,   target: aarch64-pc-windows-msvc,   inst: windows, ext: ".exe", arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sibling open-cpu (bundled)
        shell: bash
        run: |
          [ -d "$GITHUB_WORKSPACE/../open-cpu" ] || git clone --depth 1 https://github.com/aon-co-jp/open-cpu.git "$GITHUB_WORKSPACE/../open-cpu"
      - uses: actions/setup-python@v5
        if: github.event_name == 'schedule' && !contains(matrix.os, 'arm')
        with: { python-version: "3.x" }   # 最新の CPython との差分試験
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: test (differential vs CPython)
        shell: bash
        run: python3 tests/run.py target/${{ matrix.target }}/release/rmojo${{ matrix.ext }} || python tests/run.py target/${{ matrix.target }}/release/rmojo${{ matrix.ext }}
      - name: package (unix)
        if: matrix.inst != 'windows'
        shell: bash
        run: |
          d=rmojo-${{ matrix.target }}; mkdir $d
          cp target/${{ matrix.target }}/release/rmojo $d/; cp installers/${{ matrix.inst }}/*.sh $d/; cp -r examples README.md LICENSE $d/
          tar czf $d.tar.gz $d
      - name: installer (windows)
        if: matrix.inst == 'windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DArch=${{ matrix.arch }} /DBinDir=..\..\target\${{ matrix.target }}\release installers\windows\rmojo.iss
          Copy-Item installers\windows\Output\RMojo-Setup-${{ matrix.arch }}.exe RMojo-Setup-${{ matrix.arch }}.exe
      - uses: actions/upload-artifact@v4
        with: { name: "rmojo-${{ matrix.target }}", path: "rmojo-*.tar.gz\nRMojo-Setup-*.exe", if-no-files-found: ignore }
  upstream-issue:
    # 毎日の定期実行(最新の Python / Flask / Django / FastAPI / Rust で再試験)が失敗したら、日付つきで issue を1件起こす
    if: failure() && github.event_name == 'schedule'
    needs: [build]
    runs-on: ubuntu-latest
    permissions: { issues: write }
    steps:
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          t="upstream: 最新版での定期試験が失敗 ($(date -u +%F))"
          gh issue list -R "$GITHUB_REPOSITORY" --state open --search "$t in:title" --json number -q '.[0].number' | grep -q . ||             gh issue create -R "$GITHUB_REPOSITORY" --title "$t" --body "最新の上流(Python・Flask・Django・FastAPI・Starlette・Rust・Mojo)で定期試験が失敗しました。実行: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
  update-test:
    # 自動更新の実機相当試験: 版を 0.0.1 に偽装したビルドで、実リリースへの更新(取得→SHA-256検証→置換→次回起動の通知)を通す
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sibling open-cpu (bundled)
        shell: bash
        run: |
          [ -d "$GITHUB_WORKSPACE/../open-cpu" ] || git clone --depth 1 https://github.com/aon-co-jp/open-cpu.git "$GITHUB_WORKSPACE/../open-cpu"
      - name: build as 0.0.1 and update
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          sed -i.bak '0,/^version = "[^"]*"/s//version = "0.0.1"/' Cargo.toml
          cargo build --release
          mkdir -p "$RUNNER_TEMP/h"; cp target/release/rmojo "$RUNNER_TEMP/rmojo"
          unset CI
          export HOME="$RUNNER_TEMP/h"
          "$RUNNER_TEMP/rmojo" --version | grep -q "0.0.1"
          "$RUNNER_TEMP/rmojo" update | tee "$RUNNER_TEMP/out.txt"
          grep -q "に更新しました" "$RUNNER_TEMP/out.txt"
          "$RUNNER_TEMP/rmojo" --version 2>"$RUNNER_TEMP/err.txt" | tee "$RUNNER_TEMP/ver.txt"
          ! grep -q "0.0.1" "$RUNNER_TEMP/ver.txt"
          grep -q "に更新しました" "$RUNNER_TEMP/err.txt"
  android-ios-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sibling open-cpu (bundled)
        shell: bash
        run: |
          [ -d "$GITHUB_WORKSPACE/../open-cpu" ] || git clone --depth 1 https://github.com/aon-co-jp/open-cpu.git "$GITHUB_WORKSPACE/../open-cpu"
      - run: rustup target add aarch64-apple-ios aarch64-linux-android
      - run: cargo check --release --target aarch64-apple-ios
      - run: |
          cargo install cargo-ndk --locked
          rustup target add aarch64-linux-android
          cargo ndk -t arm64-v8a build --release
          mkdir rmojo-android-aarch64; cp target/aarch64-linux-android/release/rmojo installers/android/install.sh README.md rmojo-android-aarch64/
          tar czf rmojo-android-aarch64.tar.gz rmojo-android-aarch64
      - uses: actions/upload-artifact@v4
        with: { name: rmojo-android-aarch64, path: rmojo-android-aarch64.tar.gz }
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android-ios-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: sha256 for every asset (used by the startup self-update to verify downloads)
        run: cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done
      - uses: softprops/action-gh-release@v2
        with: { files: "dist/*" }
